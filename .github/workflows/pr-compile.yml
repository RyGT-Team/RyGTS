name: Pull request compile check
on:
  pull_request:
    branches: [development, main]
permissions:
  contents: read
concurrency:
  group: pr-compile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  converter:
    name: Compile Linux converter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build
      - name: Compile converter and run its tests
        run: |
          cmake --preset linux-release-cli
          cmake --build --preset linux-release-cli --parallel 2
          ctest --test-dir build/linux-release-cli --output-on-failure --no-tests=error
  runtime:
    name: Compile Windows runtime and launcher
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Keep native and MSYS2 checkouts consistent
        shell: pwsh
        run: |
          git config --global core.autocrlf input
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure LF checkout policy' }
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable long checkout paths' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys2
        with:
          msystem: UCRT64
          location: C:/msys64
          update: true
          cache: false
          # FEAT-GTS-260: only MSYS2's Unix tools; the runtime compiler is the pinned GCC from
          # ci/runtime-toolchain.json, the same one the package build uses.
          install: >-
            base-devel git
      - name: Compile runtime DLLs, converter, wheel probe, and launcher
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Checked([string]$Program, [string[]]$Arguments) {
            & $Program @Arguments
            if ($LASTEXITCODE -ne 0) { throw "$Program failed with exit code $LASTEXITCODE" }
          }
          $nativePython = (Get-Command python.exe -CommandType Application).Source.Replace('\','/')
          Invoke-Checked python @('-m','pip','install','--disable-pip-version-check','cmake==3.31.6','ninja==1.11.1.4','zstandard==0.25.0')
          $scripts = (& python -c "import sysconfig; print(sysconfig.get_path('scripts'))").Trim().Replace('\','/')
          $tools = Join-Path $env:RUNNER_TEMP 'runtime-tools'
          $ucrtBin = (& python ci/runtime_toolchain.py install $tools | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0 -or !$ucrtBin) { throw 'Pinned runtime toolchain unavailable' }
          $ucrtBin = $ucrtBin.Replace('\','/')
          $ffmpeg = (& python ci/runtime_toolchain.py ffmpeg $tools | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0 -or !$ffmpeg) { throw 'Pinned FFmpeg package unavailable' }
          $ffmpeg = $ffmpeg.Replace('\','/')
          $msysRoot = $env:MSYS2_ROOT.Replace('\','/')
          $env:PATH = "$ucrtBin;$msysRoot/usr/bin;$env:PATH"
          $build = Join-Path $env:RUNNER_TEMP 'pr-runtime-build'
          Invoke-Checked "$scripts/cmake.exe" @('-S','.','-B',$build,'-G','Ninja',"-DCMAKE_MAKE_PROGRAM=$scripts/ninja.exe",'-DCMAKE_BUILD_TYPE=Release','-DRTY_BUILD_GUI=OFF','-DBUILD_TESTING=OFF','-DRTY_ENABLE_LTO=OFF',"-DCMAKE_C_COMPILER=$ucrtBin/gcc.exe","-DCMAKE_CXX_COMPILER=$ucrtBin/g++.exe","-DPython3_EXECUTABLE=$nativePython","-DFFMPEG_PREBUILT_DIR=$ffmpeg")
          Invoke-Checked "$scripts/cmake.exe" @('--build',$build,'--target','ryty','libs','ryty-wheel-probe','--parallel','4')
      - name: Compile launcher
        shell: cmd
        run: |
          if not exist "%RUNNER_TEMP%\pr-launcher" mkdir "%RUNNER_TEMP%\pr-launcher"
          if errorlevel 1 exit /b 1
          call loader\build.cmd "%RUNNER_TEMP%\pr-launcher"
